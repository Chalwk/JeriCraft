title: JeriCraft
description: Official website for the JeriCraft Minecraft community.

url: "https://jericraft.net"
baseurl: ""
locale: en_NZ
timezone: Pacific/Auckland
site_scale: 0.65

author:
  name: Jericho Crosby
  url: https://github.com/Chalwk

image: /assets/images/logos/jericraft-logo.png
favicon: favicon.ico

links:
  email: chalwk.dev@gmail.com
  discord: https://discord.gg/3HkQ4cGVnS
  ban_appeal: https://github.com/Chalwk/JeriCraft/issues/new?template=ban-appeal.yml

minecraft_version: "1.21.4"

sass:
  style: compressed

incremental: true
plugins_cache: true

markdown: kramdown
kramdown:
  syntax_highlighter: nil
  hard_wrap: true

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

collections:
  guides:
    output: true
    permalink: /:collection/:path/
  shops:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: "guides"
    values:
      layout: page
  - scope:
      type: "shops"
    values:
      layout: page
  - scope:
      path: "about.md"
    values:
      layout: page
  - scope:
      path: "store.md"
    values:
      layout: page
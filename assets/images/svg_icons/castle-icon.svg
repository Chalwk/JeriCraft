<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 4 90 96">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#110e15" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base / Moat -->
  <rect x="5" y="85" width="90" height="15" fill="#2b1d14" rx="3" />
  
  <!-- Main Keep (Center Structure) -->
  <rect x="32" y="50" width="36" height="35" fill="#382a1c" />
  
  <!-- Center Wall Battlements -->
  <rect x="32" y="40" width="6" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />
  <rect x="44" y="40" width="6" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />
  <rect x="56" y="40" width="6" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />

  <!-- Left Tower -->
  <rect x="10" y="30" width="22" height="55" fill="#4d3726" filter="url(#shadow)" />
  <rect x="10" y="20" width="4" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />
  <rect x="18" y="20" width="4" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />
  <rect x="26" y="20" width="4" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />
  <polygon points="10,30 21,12 32,30" fill="#60251d" stroke="#110e15" stroke-width="1.5" />
  <rect x="14" y="45" width="6" height="10" fill="#f6e4a4" rx="2" stroke="#110e15" stroke-width="1" />
  <rect x="22" y="45" width="6" height="10" fill="#f6e4a4" rx="2" stroke="#110e15" stroke-width="1" />

  <!-- Right Tower -->
  <rect x="68" y="30" width="22" height="55" fill="#4d3726" filter="url(#shadow)" />
  <rect x="68" y="20" width="4" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />
  <rect x="76" y="20" width="4" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />
  <rect x="84" y="20" width="4" height="10" fill="#4d3726" stroke="#cfa56b" stroke-width="0.5" />
  <polygon points="68,30 79,12 90,30" fill="#60251d" stroke="#110e15" stroke-width="1.5" />
  <rect x="72" y="45" width="6" height="10" fill="#f6e4a4" rx="2" stroke="#110e15" stroke-width="1" />
  <rect x="80" y="45" width="6" height="10" fill="#f6e4a4" rx="2" stroke="#110e15" stroke-width="1" />

  <!-- Flags -->
  <line x1="21" y1="12" x2="21" y2="4" stroke="#110e15" stroke-width="2" />
  <polygon points="21,4 30,7 21,10" fill="#cfa56b" stroke="#110e15" stroke-width="0.5" />
  <line x1="79" y1="12" x2="79" y2="4" stroke="#110e15" stroke-width="2" />
  <polygon points="79,4 88,7 79,10" fill="#cfa56b" stroke="#110e15" stroke-width="0.5" />

  <!-- Central Gate -->
  <path d="M40 90 L40 70 A10 10 0 0 1 60 70 L60 90 Z" fill="#110e15" />
  <path d="M44 90 L44 73 A6 6 0 0 1 56 73 L56 90 Z" fill="#d06a57" stroke="#110e15" stroke-width="1" />
  <line x1="50" y1="73" x2="50" y2="90" stroke="#110e15" stroke-width="1.5" />

  <!-- Stone Texture -->
  <line x1="15" y1="60" x2="30" y2="60" stroke="#110e15" stroke-width="0.75" opacity="0.4" />
  <line x1="15" y1="70" x2="30" y2="70" stroke="#110e15" stroke-width="0.75" opacity="0.4" />
  <line x1="70" y1="60" x2="85" y2="60" stroke="#110e15" stroke-width="0.75" opacity="0.4" />
  <line x1="70" y1="70" x2="85" y2="70" stroke="#110e15" stroke-width="0.75" opacity="0.4" />
  <line x1="35" y1="65" x2="45" y2="65" stroke="#110e15" stroke-width="0.75" opacity="0.4" />
  <line x1="55" y1="65" x2="65" y2="65" stroke="#110e15" stroke-width="0.75" opacity="0.4" />
</svg>
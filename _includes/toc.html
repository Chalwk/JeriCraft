<div class="toc-container">
    <details class="toc-details" {% if page.toc_open %}open{% endif %}>
        <summary class="toc-summary">
            <i class="fas fa-list-ul" aria-hidden="true"></i> Table of Contents
        </summary>
        <div class="toc-content" id="jekyll-toc-placeholder">
            <ul>
                <li>Loading table of contents...</li>
            </ul>
        </div>
    </details>
</div>

<script>
    (function () {
        function getScope() {
            const activePanel = document.querySelector('.tab-content.active');
            if (activePanel) return activePanel;
            return document.querySelector('#page-content, .page-content');
        }

        function slugify(text) {
            return text
                .toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .trim()
                .replace(/\s+/g, '-')
                .slice(0, 60);
        }

        function buildToc() {
            const placeholder = document.getElementById('jekyll-toc-placeholder');
            if (!placeholder) return;

            const scope = getScope();
            const tocDetails = placeholder.closest('details');

            if (!scope) {
                if (tocDetails) tocDetails.style.display = 'none';
                return;
            }

            const headings = scope.querySelectorAll('h1, h2, h3, h4, h5, h6');
            if (headings.length === 0) {
                if (tocDetails) tocDetails.style.display = 'none';
                return;
            }

            if (tocDetails) tocDetails.style.display = '';

            headings.forEach((heading, idx) => {
                if (!heading.id) {
                    heading.id = 'toc-' + (slugify(heading.textContent) || 'heading-' + idx);
                }
            });

            // Root list + a stack of open lists keyed by their heading level.
            const toc = document.createElement('ul');
            const stack = [{ level: 1, list: toc }];

            headings.forEach((heading) => {
                const level = parseInt(heading.tagName[1], 10);

                const link = document.createElement('a');
                link.href = '#' + heading.id;
                link.textContent = heading.textContent;

                const item = document.createElement('li');
                item.appendChild(link);

                // Pop the stack until we find the deepest list whose level is
                // strictly shallower than the current heading.
                while (stack.length > 1 && stack[stack.length - 1].level >= level) {
                    stack.pop();
                }

                const parent = stack[stack.length - 1];
                parent.list.appendChild(item);

                // Prepare a nested list for any children of this heading.
                const childList = document.createElement('ul');
                item.appendChild(childList);
                stack.push({ level: level, list: childList });
            });

            // Remove empty trailing <ul>s that no child ever used.
            toc.querySelectorAll('ul').forEach(ul => {
                if (!ul.children.length) ul.remove();
            });

            placeholder.innerHTML = '';
            placeholder.appendChild(toc);
        }

        document.addEventListener('DOMContentLoaded', buildToc);
        document.addEventListener('tabchange', buildToc);
    })();
</script>
